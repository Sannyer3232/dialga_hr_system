services:
  backend:
    build: ./back-end
    container_name: dialga_hr_backend
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    ports:
      - "8001:8000"
    volumes:
      - ./back-end:/app

  frontend:
    build: ./front-end
    container_name: dialga_hr_frontend
    environment:
      PORT: 5566
      API_BASE_URL: http://backend:8000/api
    ports:
      - "5566:5566"
    volumes:
      - ./front-end/src:/app/src
    depends_on:
      - backend
